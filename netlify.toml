[build]
  command = "node generate-sitemap.js"
  publish = "."
  functions = "netlify/functions"
  edge_functions = "netlify/edge-functions"

[[edge_functions]]
  path = "/*"
  function = "markdown-negotiation"

[[redirects]]
  from = "/api/call-lead"
  to = "/.netlify/functions/call-lead"
  status = 200

[[redirects]]
  from = "/mcp"
  to = "/.netlify/functions/mcp"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Link = '</.well-known/api-catalog>; rel="api-catalog", </robots.txt>; rel="describedby", </.well-known/mcp/server-card.json>; rel="service-desc", </index.md>; rel="alternate"; type="text/markdown"'

[[headers]]
  for = "/"
  [headers.values]
    Link = '</.well-known/api-catalog>; rel="api-catalog", </robots.txt>; rel="describedby", </.well-known/mcp/server-card.json>; rel="service-desc", </index.md>; rel="alternate"; type="text/markdown"'

[[headers]]
  for = "/index.html"
  [headers.values]
    Link = '</.well-known/api-catalog>; rel="api-catalog", </robots.txt>; rel="describedby", </.well-known/mcp/server-card.json>; rel="service-desc", </index.md>; rel="alternate"; type="text/markdown"'

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Vary = "Accept"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Vary = "Accept"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/.well-known/api-catalog"
  [headers.values]
    Content-Type = 'application/linkset+json; profile="https://www.rfc-editor.org/info/rfc9727"'
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/.well-known/api-catalog.json"
  [headers.values]
    Content-Type = 'application/linkset+json; profile="https://www.rfc-editor.org/info/rfc9727"'
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/.well-known/mcp/server-card.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/.well-known/mcp.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=86400"




